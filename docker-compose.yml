services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/searxng/custom-entrypoint.sh"]
    ports:
      - "8787:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml
      - ./limiter.toml:/etc/searxng/limiter.toml:ro
      - ./entrypoint.sh:/etc/searxng/custom-entrypoint.sh:ro
      - searxng-data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8787/
      - SEARXNG_SECRET=b7a076533f74299952884eaf7e95732df3278a0f062d62c0125b0a31e0ae79b6
      - PROXY_SOCKS5=${PROXY_SOCKS5:-}
      - PROXY_HTTP=${PROXY_HTTP:-}
      - NO_PROXY=localhost,127.0.0.1,redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  redis:
    image: redis:7-alpine
    container_name: searxng-redis
    restart: unless-stopped
    command: redis-server --save 30 1 --loglevel warning
    volumes:
      - redis-data:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  searxng-data:
  redis-data:
